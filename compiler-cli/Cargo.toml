[package]
name = "tau-lang-cli"
version = "0.1.0"
authors = ["Karl Zschiebsch"]
edition = "2024"

description = "Command line interface for the Tau compiler."
readme = "../README.md"
license-file = "../LICENSE"
homepage = "https://codeberg.org/tau-lang"
repository = "https://github.com/tau-lang/tau"
keywords = ["tau", "cli"]

[lib]
name = "tau_cli"

[features]
default = ["c"]
c = ["dep:tau-generator-c"]

[dependencies]
# The pure compiler
tau-lang-core = { path = "../compiler-core", version = "0.1.0" }
tau-generator-c = { path = "../generator-c", version = "0.1.0", optional = true }
tau-generator-qbe = { path = "../generator-qbe", version = "0.1.0" }
codespan-reporting = { workspace = true }
symbol_table = { workspace = true }
bpaf = { version = "0.9.28", features = ["autocomplete", "derive"] }
