[package]
name = "tau-lang-cli"
version = "0.1.0"
authors = ["Karl Zschiebsch"]
edition = "2024"

description = "Command line interface for the Tau compiler."
readme = "README.md"
license-file = "../LICENSE"
homepage = "https://codeberg.org/tau-lang"
repository = "https://codeberg.org/tau-lang/tau"
keywords = ["tau-lang", "cli"]

[lib]
name = "tau_cli"

[features]
default = ["c", "qbe"]
c = ["dep:tau-generator-c"]
qbe = ["dep:tau-generator-qbe"]
bright-color = ["bpaf/bright-color"]
dull-color = ["bpaf/dull-color"]

[dependencies]
tau-lang-core = { workspace = true }
tau-generator-c = { workspace = true, optional = true }
tau-generator-qbe = { workspace = true, optional = true }
codespan-reporting = { workspace = true }
symbol_table = { workspace = true }
bpaf = { version = "0.9.28", features = ["autocomplete", "derive"] }
