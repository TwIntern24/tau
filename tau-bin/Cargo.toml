[package]
name = "tau-lang"
version = "0.1.0"
authors = ["Karl Zschiebsch"]
edition = "2024"

description = "Compiler for the Tau language."
readme = "README.md"
license-file = "../LICENSE"
homepage = "https://codeberg.org/tau-lang"
repository = "https://codeberg.org/tau-lang/tau"

[[bin]]
name = "tau"
path = "src/main.rs"

[dependencies]
tau-lang-cli = { workspace = true, features = ["dull-color"] }
